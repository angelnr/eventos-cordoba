# docker-compose.yml — despliegue "un puerto por web" vía ZeroTier
#
# Solo Nginx expone un puerto HOST (el de esta web: 3000).
# frontend y backend quedan SOLO dentro de la red interna de Docker:
#   http://172.29.158.65:3000        → Frontend (Next.js) vía Nginx
#   http://172.29.158.65:3000/api/*  → Backend  (Express) vía Nginx
#
# Al compartir el mismo origen no hay CORS que configurar.
# El puerto se controla con WEB_PORT (ver .env): WEB_PORT=3000
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: mi_app_db
      POSTGRES_USER: mi_usuario
      POSTGRES_PASSWORD: password123
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build: ./backend
    # Sin puertos host: solo accesible desde la red interna vía Nginx
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - uploads_data:/app/uploads
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - PORT=3001
      - NODE_ENV=development
      - UPLOAD_DIR=/app/uploads
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL}
    depends_on:
      - postgres
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    # Sin puertos host: solo accesible desde la red interna vía Nginx
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL}
      - NODE_ENV=production
    networks:
      - app-network
    restart: unless-stopped

  # Tunel Cloudflare SOLO para acceso por dominio (eventoscordoba.xyz).
  # Como ahora usas ZeroTier sin dominio, lo dejamos desactivado.
  # Si algún día quieres exponer la web públicamente, descomenta:
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARED_TOKEN}
  #   network_mode: "host"
  #   restart: unless-stopped

  nginx:
    build: ./nginx
    ports:
      - "${WEB_PORT:-3000}:80"   # ← PUERTO de acceso a esta web desde ZeroTier
    volumes:
      - uploads_data:/app/uploads:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  uploads_data:
